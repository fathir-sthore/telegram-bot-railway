version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: telegram-bot-railway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BOT_TOKEN=${BOT_TOKEN:-your_bot_token_here}
      - PORT=3000
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge

volumes:
  database-data:
  log-data: